name: Build DS Game (Android APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Build Android APK (Android 8-15 arm64+arm32+x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package name consistency
        run: |
          grep -q 'package="com.cb4"' game/AndroidManifest.xml
          grep -q 'android:versionCode="[0-9]\+"' game/AndroidManifest.xml
          grep -q 'android:versionName="[^"]\+"' game/AndroidManifest.xml
          grep -q 'android:name="com.cb4.GameActivity"' game/AndroidManifest.xml
          grep -q '^package com.cb4;' game/java/com/dimscript/gamedemo/GameActivity.java
          grep -q 'Java_com_cb4_GameActivity_nativeReplaceText' runtime.c
          grep -q 'Java_com_cb4_GameActivity_nativeSubmitText' runtime.c
          grep -q 'Java_com_cb4_GameActivity_nativeKeyboardHidden' runtime.c
          ! grep -rn 'dimscript\.gamedemo\|Java_com_dimscript\|com\.CB4\|Java_com_CB4' \
            game/AndroidManifest.xml game/java runtime.c

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Подпись — отладочным ключом (`androiddebugkey`, пароль `android`),
      # никаких секретов в репозитории не нужно. Ключ генерируется в самой
      # сборке и кэшируется между запусками, чтобы APK ставился «поверх»
      # предыдущего, а не требовал удаления приложения. Ключ кэша намеренно без
      # имени ветки: сборки веток видят кэш main, поэтому у всех сборок одна и
      # та же подпись. Для публикации в RuStore/Google Play такая подпись не
      # годится — там нужен релизный ключ.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cb4-debug
          key: cb4-debug-keystore-v1
          restore-keys: cb4-debug-keystore-v1-

      - name: Install Android SDK packages
        # android-actions/setup-android@v3 больше не используется: на свежих
        # раннерах он считает предустановленный sdkmanager (cmdline-tools 12.0)
        # «wrong version», перекачивает cmdline-tools и падает. На раннерах
        # GitHub уже есть рабочий SDK под $ANDROID_HOME - принимаем лицензии
        # и ставим пакеты им напрямую (с запасной загрузкой cmdline-tools).
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "Preinstalled cmdline-tools not found - downloading"
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$TMP"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game.c
        run: python3 gen.py

      # 3D-слой рендера (native/graphics/render3d.inc) проверяется на хосте
      # без Vulkan: проекция, отбор задних граней, обрезка у глаза, порядок
      # художника и вывод в общий командный список.
      - name: "Host test: 3D renderer"
        run: |
          gcc -std=gnu99 -O1 -o /tmp/test_3d tools/host_test/test_3d.c \
            -I tools/host_test/stub -I . -lm
          /tmp/test_3d

      # 3D-платформер: настоящие скрипты игры гоняются на хосте (спавн,
      # прыжки, монеты, чекпоинты, финиш, кнопка в лобби, слои кадра).
      - name: "Host test: 3D platformer"
        run: python3 tools/test_platformer3d.py

      - name: Stage assets
        run: python3 stage_assets.py game/assets staging/assets

      - name: Build native libraries
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"

          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64

          "$TOOLCHAIN/aarch64-linux-android26-clang" -O3 -s -fPIC -shared \
            game/game.c runtime.c main.c "$GLUE/android_native_app_glue.c" \
            -I. -I"$GLUE" -landroid -llog -lm -lvulkan \
            -o staging/lib/arm64-v8a/libds_game.so

          "$TOOLCHAIN/armv7a-linux-androideabi26-clang" -O3 -s -fPIC -shared \
            game/game.c runtime.c main.c "$GLUE/android_native_app_glue.c" \
            -I. -I"$GLUE" -landroid -llog -lm -lvulkan \
            -o staging/lib/armeabi-v7a/libds_game.so

          "$TOOLCHAIN/x86_64-linux-android26-clang" -O3 -s -fPIC -shared \
            game/game.c runtime.c main.c "$GLUE/android_native_app_glue.c" \
            -I. -I"$GLUE" -landroid -llog -lm -lvulkan \
            -o staging/lib/x86_64/libds_game.so

      - name: Package and align APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"

          VERSION_CODE="$(sed -n 's/.*android:versionCode="\([0-9]\+\)".*/\1/p' game/AndroidManifest.xml | head -n1)"
          VERSION_NAME="$(sed -n 's/.*android:versionName="\([^"]\+\)".*/\1/p' game/AndroidManifest.xml | head -n1)"
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"

          "$BT/aapt" package -f \
            -M game/AndroidManifest.xml \
            -S game/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            -F unsigned.apk ./staging/

          "$BT/zipalign" -v 4 unsigned.apk aligned.apk

      - name: Sign APK with debug key
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          KEY_DIR="$RUNNER_TEMP/cb4-debug"
          KEYSTORE="$KEY_DIR/debug.keystore"

          umask 077
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          # Ключ создаётся один раз: дальше его подхватывает кэш, поэтому
          # подпись не меняется от сборки к сборке.
          if [[ ! -f "$KEYSTORE" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            chmod 600 "$KEYSTORE"
          fi

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out Game.apk aligned.apk

      - name: Verify APK metadata and signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging Game.apk | head -n 5
          "$BT/aapt" dump badging Game.apk | grep -q "versionCode='[0-9]\+'" \
            || { echo "::error::APK has no versionCode - store checks will reject it."; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs Game.apk
          "$BT/apksigner" verify --print-certs Game.apk | grep -q "CN=Android Debug" \
            || { echo "::error::APK is not signed with the debug key."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Game-APK-Android8-15-arm64-arm32-x86_64
          path: Game.apk
          if-no-files-found: error
