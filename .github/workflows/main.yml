name: Build DS Game (Android APK)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-android:
    name: Build Android APK (Android 8-15 arm64+arm32+x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check package name consistency
        run: |
          grep -q 'package="com.cb4"' game/AndroidManifest.xml
          grep -q 'android:versionCode="[0-9]\+"' game/AndroidManifest.xml
          grep -q 'android:versionName="[^"]\+"' game/AndroidManifest.xml
          grep -q 'android:name="com.cb4.GameActivity"' game/AndroidManifest.xml
          grep -q '^package com.cb4;' game/java/com/dimscript/gamedemo/GameActivity.java
          grep -q 'Java_com_cb4_GameActivity_nativeReplaceText' runtime.c
          grep -q 'Java_com_cb4_GameActivity_nativeSubmitText' runtime.c
          grep -q 'Java_com_cb4_GameActivity_nativeKeyboardHidden' runtime.c
          ! grep -rn 'dimscript\.gamedemo\|Java_com_dimscript\|com\.CB4\|Java_com_CB4' \
            game/AndroidManifest.xml game/java runtime.c

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key from Secrets
        env:
          CB4_P12_BASE64: ${{ secrets.CB4_P12_BASE64 }}
          CB4_P12_PASSWORD: ${{ secrets.CB4_P12_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$CB4_P12_BASE64" || -z "$CB4_P12_PASSWORD" ]]; then
            echo "::error::Add CB4_P12_BASE64 and CB4_P12_PASSWORD repository secrets."
            exit 1
          fi

          umask 077
          KEY_DIR="$RUNNER_TEMP/cb4-signing"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"

          if ! printf '%s' "$CB4_P12_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$KEY_DIR/CB4.p12"; then
            echo "::error::CB4_P12_BASE64 is not valid Base64."
            exit 1
          fi

          chmod 600 "$KEY_DIR/CB4.p12"

          if ! keytool -list -storetype PKCS12 \
            -keystore "$KEY_DIR/CB4.p12" \
            -storepass:env CB4_P12_PASSWORD > /dev/null; then
            echo "::error::Cannot open the P12. Check the key and its password."
            exit 1
          fi

      - name: Install Android SDK packages
        # android-actions/setup-android@v3 больше не используется: на свежих
        # раннерах он считает предустановленный sdkmanager (cmdline-tools 12.0)
        # «wrong version», перекачивает cmdline-tools и падает. На раннерах
        # GitHub уже есть рабочий SDK под $ANDROID_HOME - принимаем лицензии
        # и ставим пакеты им напрямую (с запасной загрузкой cmdline-tools).
        run: |
          set -euo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "Preinstalled cmdline-tools not found - downloading"
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$TMP/tools.zip" -d "$TMP"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$TMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$TMP"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate game.c
        run: python3 gen.py

      - name: Stage assets
        run: python3 stage_assets.py game/assets staging/assets

      - name: Build native libraries
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GLUE="$NDK_ROOT/sources/android/native_app_glue"

          mkdir -p staging/lib/arm64-v8a staging/lib/armeabi-v7a staging/lib/x86_64

          "$TOOLCHAIN/aarch64-linux-android26-clang" -O3 -s -fPIC -shared \
            game/game.c runtime.c main.c "$GLUE/android_native_app_glue.c" \
            -I. -I"$GLUE" -landroid -llog -lm -lvulkan \
            -o staging/lib/arm64-v8a/libds_game.so

          "$TOOLCHAIN/armv7a-linux-androideabi26-clang" -O3 -s -fPIC -shared \
            game/game.c runtime.c main.c "$GLUE/android_native_app_glue.c" \
            -I. -I"$GLUE" -landroid -llog -lm -lvulkan \
            -o staging/lib/armeabi-v7a/libds_game.so

          "$TOOLCHAIN/x86_64-linux-android26-clang" -O3 -s -fPIC -shared \
            game/game.c runtime.c main.c "$GLUE/android_native_app_glue.c" \
            -I. -I"$GLUE" -landroid -llog -lm -lvulkan \
            -o staging/lib/x86_64/libds_game.so

      - name: Package and align APK
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"

          VERSION_CODE="$(sed -n 's/.*android:versionCode="\([0-9]\+\)".*/\1/p' game/AndroidManifest.xml | head -n1)"
          VERSION_NAME="$(sed -n 's/.*android:versionName="\([^"]\+\)".*/\1/p' game/AndroidManifest.xml | head -n1)"
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"

          "$BT/aapt" package -f \
            -M game/AndroidManifest.xml \
            -S game/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            -F unsigned.apk ./staging/

          "$BT/zipalign" -v 4 unsigned.apk aligned.apk

      - name: Sign APK
        env:
          CB4_P12_PASSWORD: ${{ secrets.CB4_P12_PASSWORD }}
          CB4_KEY_ALIAS: ${{ secrets.CB4_KEY_ALIAS }}
          CB4_KEY_PASSWORD: ${{ secrets.CB4_KEY_PASSWORD || secrets.CB4_P12_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"

          SIGN_ARGS=(
            --ks "$RUNNER_TEMP/cb4-signing/CB4.p12"
            --ks-type PKCS12
            --ks-pass env:CB4_P12_PASSWORD
            --key-pass env:CB4_KEY_PASSWORD
          )

          if [[ -n "$CB4_KEY_ALIAS" ]]; then
            SIGN_ARGS+=(--ks-key-alias "$CB4_KEY_ALIAS")
          fi

          "$BT/apksigner" sign "${SIGN_ARGS[@]}" \
            --out Game.apk aligned.apk

      - name: Verify APK metadata and signature
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt" dump badging Game.apk | head -n 5
          "$BT/aapt" dump badging Game.apk | grep -q "versionCode='[0-9]\+'" \
            || { echo "::error::APK has no versionCode - RuStore will reject it."; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs Game.apk

      - name: Delete temporary signing key
        if: ${{ always() }}
        run: rm -rf -- "${RUNNER_TEMP:?}/cb4-signing"

      - uses: actions/upload-artifact@v4
        with:
          name: Game-APK-Android8-15-arm64-arm32-x86_64
          path: Game.apk
          if-no-files-found: error
